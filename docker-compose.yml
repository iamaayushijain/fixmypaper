services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: research-paper-backend
    ports:
      - "5001:7860"
    environment:
      - PORT=7860
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_REF_MODEL=${OPENAI_REF_MODEL:-gpt-4.1-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_REF_TIMEOUT_SECONDS=${OPENAI_REF_TIMEOUT_SECONDS:-180}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: research-paper-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always
