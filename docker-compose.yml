services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: research-paper-backend
    ports:
      - "5001:7860"
    environment:
      - PORT=7860
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_REF_MODEL=${OPENAI_REF_MODEL:-gpt-4.1-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_REF_TIMEOUT_SECONDS=${OPENAI_REF_TIMEOUT_SECONDS:-180}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
        UPLOAD_PROXY_TIMEOUT_MS: ${UPLOAD_PROXY_TIMEOUT_MS}
    container_name: research-paper-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      UPLOAD_PROXY_TIMEOUT_MS: ${UPLOAD_PROXY_TIMEOUT_MS}
    depends_on:
      backend:
        condition: service_healthy
    restart: always
